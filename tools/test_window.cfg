; A worktree that runs tests: its windows never take the keyboard or the mouse,
; open as a title bar in a corner of the screen and are off it three seconds
; later (scripts/test_window.gd; CLAUDE.md, "Testing").
;
; Copy this to override.cfg beside project.godot IN A WORKTREE. Never in the
; main folder: the game window there could not be clicked into.
[display]

window/size/no_focus=true
window/size/window_width_override=16
window/size/window_height_override=16
window/size/initial_position_type=0
window/size/initial_position=Vector2i(30000, 30000)
